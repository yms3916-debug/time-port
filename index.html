
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d18">
<title>TIMEPORT - Your Memories, Across Time</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Arial",sans-serif}
header{padding:30px 22px 20px;text-align:center}
.logo{font-size:30px;font-weight:900;letter-spacing:4px;color:#e9c77b}
.sub{color:#9da7ba;font-size:13px;margin-top:8px}
main{padding:12px 18px 50px;max-width:700px;margin:auto}
.panel{background:#111a2b;border:1px solid #26334a;border-radius:20px;padding:20px;margin-bottom:18px}
h2{font-size:18px;margin:0 0 16px}
.upload{display:block;text-align:center;padding:30px 15px;border:1px dashed #687b9c;border-radius:15px;color:#c7d2e5}
.upload input{display:block;margin:15px auto 0;max-width:100%}
select,button{font-size:15px;border:0;border-radius:12px;padding:13px}
select{background:#202d43;color:white;width:100%}
button{background:#d8b66b;color:#101522;font-weight:800;cursor:pointer}
button:disabled{opacity:.4}
.eras{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.era{background:#202d43;color:#dce4f2;border:1px solid #35445e;padding:12px 4px;border-radius:10px}
.era.active{background:#d8b66b;color:#101522;border-color:#d8b66b}
#results{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.result{background:#111a2b;border:1px solid #26334a;border-radius:14px;padding:9px;min-width:0}
.result canvas{width:100%;height:auto;border-radius:8px;display:block}
.result strong{display:block;text-align:center;padding:9px 0;font-size:14px}
.result button{width:100%;font-size:12px;padding:10px}
#preview{display:none;width:100%;border-radius:12px;margin-top:15px}
.note{font-size:12px;color:#8d9bb2;line-height:1.6}
.action{width:100%;margin-top:16px}
footer{text-align:center;color:#718098;font-size:11px;padding:20px}
</style>
</head>
<body>
<header>
<div class="logo">TIMEPORT</div>
<div class="sub">YOUR MEMORIES, ACROSS TIME</div>
</header>
<main>
<section class="panel">
<h2>01. 사진 업로드</h2>
<label class="upload">
사진을 선택하고 과거의 시간으로 여행하세요
<input type="file" id="photo" accept="image/*">
</label>
<img id="preview" alt="업로드 사진 미리보기">
</section>

<section class="panel">
<h2>02. 시간 선택</h2>
<div class="eras" id="eras">
<button class="era active" data-year="1950">1950년대</button>
<button class="era active" data-year="1960">1960년대</button>
<button class="era active" data-year="1970">1970년대</button>
<button class="era active" data-year="1980">1980년대</button>
<button class="era active" data-year="1990">1990년대</button>
<button class="era active" data-year="2000">2000년대</button>
<button class="era active" data-year="2010">2010년대</button>
<button class="era active" data-year="2020">2020년대</button>
</div>
<button class="action" id="generate">선택한 시대 비교하기</button>
</section>

<section class="panel">
<h2>03. 시간 여행 결과</h2>
<div id="results">
<p class="note">사진을 업로드하고 시대를 선택하면 결과가 여기에 표시됩니다.</p>
</div>
</section>
<p class="note">※ 현재 버전은 시대별 색감과 질감을 재현하는 사진 필터입니다. 의상, 인물, 배경을 실제 과거 모습으로 재구성하는 AI 기능은 추후 AI 서비스 연동이 필요합니다.</p>
</main>
<footer>TIMEPORT © 2026 · EVERY PHOTO HAS A STORY</footer>

<script>
const photo=document.getElementById('photo');
const preview=document.getElementById('preview');
const results=document.getElementById('results');
let source=null;

photo.addEventListener('change',()=>{
 const file=photo.files[0];
 if(!file)return;
 const url=URL.createObjectURL(file);
 const img=new Image();
 img.onload=()=>{
  source=img;
  preview.src=url;
  preview.style.display='block';
  results.innerHTML='<p class="note">사진이 준비됐어요. 시대를 선택하고 비교하기를 눌러주세요.</p>';
 };
 img.src=url;
});

document.querySelectorAll('.era').forEach(btn=>{
 btn.addEventListener('click',()=>{
  btn.classList.toggle('active');
 });
});

const styles={
 1950:{filter:'sepia(0.8) grayscale(0.45) contrast(1.15)',label:'1950년대 · 클래식 흑백'},
 1960:{filter:'sepia(0.55) saturate(0.65) contrast(1.08)',label:'1960년대 · 빈티지'},
 1970:{filter:'sepia(0.38) saturate(1.2) contrast(1.05)',label:'1970년대 · 웜 필름'},
 1980:{filter:'saturate(1.45) contrast(1.12)',label:'1980년대 · 레트로'},
 1990:{filter:'saturate(0.8) contrast(1.08) brightness(1.04)',label:'1990년대 · 아날로그'},
 2000:{filter:'saturate(1.15) contrast(1.04)',label:'2000년대 · 디지털'},
 2010:{filter:'saturate(0.95) contrast(1.04) brightness(1.04)',label:'2010년대 · 모던'},
 2020:{filter:'none',label:'2020년대 · 현재'}
};

document.getElementById('generate').addEventListener('click',()=>{
 if(!source){alert('먼저 사진을 업로드해주세요.');return;}
 const selected=[...document.querySelectorAll('.era.active')].map(b=>b.dataset.year);
 if(!selected.length){alert('시대를 하나 이상 선택해주세요.');return;}
 results.innerHTML='';
 selected.forEach(year=>{
  const style=styles[year];
  const card=document.createElement('div');
  card.className='result';
  const canvas=document.createElement('canvas');
  const max=1000;
  const scale=Math.min(1,max/source.width,max/source.height);
  canvas.width=Math.round(source.width*scale);
  canvas.height=Math.round(source.height*scale);
  const ctx=canvas.getContext('2d');
  ctx.filter=style.filter;
  ctx.drawImage(source,0,0,canvas.width,canvas.height);
  ctx.filter='none';
  const title=document.createElement('strong');
  title.textContent=style.label;
  const save=document.createElement('button');
  save.textContent='사진 저장하기';
  save.addEventListener('click',()=>{
   const link=document.createElement('a');
   link.download='TIMEPORT_'+year+'.jpg';
   link.href=canvas.toDataURL('image/jpeg',0.92);
   link.click();
  });
  card.append(canvas,title,save);
  results.appendChild(card);
 });
});
</script>
</body>
</html>
